<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画像→GIFアニメ変換</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mut:#6b6b70;--card:#f4f4f6;--bd:#d8d8de;--ac:#4a6cf7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ececf0;--mut:#9a9aa3;--card:#222227;--bd:#3a3a42;--ac:#7f97ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ececf0;--mut:#9a9aa3;--card:#222227;--bd:#3a3a42;--ac:#7f97ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.3rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
#drop{border:2px dashed var(--bd);border-radius:12px;background:var(--card);padding:28px 16px;text-align:center;cursor:pointer}
#drop.on{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin:12px 0;max-height:440px;overflow-y:auto}
.it{position:relative;cursor:grab;border-radius:6px;user-select:none}
.it img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--card)}
.it.drag{opacity:.35}
.it.over{outline:2px solid var(--ac);outline-offset:1px}
.it .nb{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;font-size:.65rem;line-height:1;padding:2px 5px;border-radius:4px}
.it .x{position:absolute;right:3px;top:3px;width:20px;height:20px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:.8rem;line-height:20px;display:none}
.it:hover .x{display:block}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:12px 0}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:4px}
input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:130px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.5;cursor:default}
progress{width:100%;height:12px}
#out{max-width:100%;border-radius:8px;margin-top:8px;background:var(--card)}
.note{color:var(--mut);font-size:.8rem}
</style>
</head>
<body>
<main>
<h1>画像 → GIFアニメ変換</h1>
<p class="sub">最大1000枚くらいまで。変換はすべてブラウザ内で行われ、画像は外部に送信されません。</p>

<div id="drop">画像をここにドロップ、またはクリックして選択<br><span class="note">追加した順に継ぎ足されます。サムネをドラッグして並べ替えできます</span></div>
<input id="file" type="file" accept="image/*" multiple hidden>

<div id="cnt" class="note" style="margin-top:10px"></div>
<div class="grid" id="thumbs"></div>

<div class="row">
  <label>1コマの時間(ミリ秒)<input id="ms" type="number" min="20" step="10" value="100"></label>
  <label>出力の幅(px)<input id="w" type="number" min="16" max="1200" step="10" value="400"></label>
  <label>余白の色<select id="bg"><option value="#ffffff">白</option><option value="#000000">黒</option></select></label>
  <label>ループ<select id="loop"><option value="0">無限</option><option value="1">1回のみ</option></select></label>
</div>
<div class="row" style="margin-top:0">
  <span class="note">目安:</span>
  <button data-ms="50">50</button><button data-ms="100">100</button><button data-ms="200">200</button><button data-ms="500">500</button><button data-ms="1000">1000</button>
</div>
<div class="row" style="margin-bottom:0">
  <label>色数<select id="cols"><option value="256">256色</option><option value="128">128色</option><option value="64">64色</option><option value="32">32色</option><option value="16">16色</option></select></label>
  <label>コマの間引き<select id="skip"><option value="1">しない</option><option value="2">2コマと1枚</option><option value="3">3コマと1枚</option><option value="4">4コマと1枚</option><option value="5">5コマと1枚</option></select></label>
  <label>差分圧縮<select id="diff"><option value="-1">なし</option><option value="0" selected>劣化なし</option><option value="150">ゆるめ</option><option value="600">強め</option></select></label>
</div>
<div class="note">容量節約用。間引きは再生速度を保つため、1コマの時間を自動で延ばします。差分圧縮は、前のコマから動かない部分を使い回して容量を減らします(背景が固定のアニメで特に効果大)。</div>
<div class="row">
  <button class="p" id="go" disabled>GIFを作成</button>
  <button id="stop" disabled>中止</button>
  <button id="rev" disabled>順序を反転</button>
  <button id="srt" disabled>名前順に並べ替え</button>
  <button id="clr" disabled>クリア</button>
</div>
<progress id="pg" value="0" max="1" hidden></progress>
<div id="st" class="note"></div>
<div id="res" hidden>
  <button id="pv" hidden>プレビューを表示(枚数が多いと重くなります)</button>
  <img id="out" alt="作成したGIF">
  <div class="row"><a id="dl" download="animation.gif"><button class="p">ダウンロード</button></a><span id="info" class="note"></span></div>
</div>
<p class="note">1コマの時間は10ミリ秒単位に丸められます(GIFの仕様)。枚数が多い・幅が大きいほどファイルサイズと処理時間が増えます。</p>
</main>
<script>
const $=s=>document.querySelector(s);
let files=[],stopFlag=false,resUrl=null,busy=false,dragI=-1;
const urlMap=new Map();
const sel=()=>files.filter((_,i)=>i%(+$('#skip').value)===0);
function getUrl(f){if(!urlMap.has(f))urlMap.set(f,URL.createObjectURL(f));return urlMap.get(f)}
function rmUrl(f){const u=urlMap.get(f);if(u){URL.revokeObjectURL(u);urlMap.delete(f)}}
const tb=new Int32Array(1<<20),st=new Uint32Array(1<<20);let stamp=0;

function lzw(px,out,mcs){
  const CL=1<<mcs,S0=mcs+1;
  let o=0,cur=0,bits=0,size=S0,maxcode=(1<<S0)-1,next=CL+2;
  const emit=(c,clr)=>{
    cur|=c<<bits;bits+=size;
    while(bits>=8){out[o++]=cur&255;cur>>>=8;bits-=8}
    if(clr){size=S0;maxcode=(1<<S0)-1;next=CL+2;stamp++}
    else if(next>maxcode&&size<12){size++;maxcode=(1<<size)-1}
  };
  stamp++;emit(CL,true);
  let prefix=px[0];
  for(let i=1;i<px.length;i++){
    const k=px[i],h=(prefix<<8)|k;
    if(st[h]===stamp){prefix=tb[h];continue}
    emit(prefix);
    if(next<4096){tb[h]=next++;st[h]=stamp}else emit(CL,true);
    prefix=k;
  }
  emit(prefix);emit(CL+1);
  if(bits>0)out[o++]=cur&255;
  return o;
}

function medianCut(samples,nc){
  const boxes=[samples];
  while(boxes.length<nc){
    let bi=-1,best=0,bc=0;
    for(let i=0;i<boxes.length;i++){
      const b=boxes[i];if(b.length<2)continue;
      let r0=255,r1=0,g0=255,g1=0,b0=255,b1=0;
      for(const v of b){const r=v>>16,g=(v>>8)&255,bl=v&255;
        if(r<r0)r0=r;if(r>r1)r1=r;if(g<g0)g0=g;if(g>g1)g1=g;if(bl<b0)b0=bl;if(bl>b1)b1=bl}
      const rr=r1-r0,gr=g1-g0,br=b1-b0,m=Math.max(rr,gr,br);
      const sc=m*Math.log2(b.length+1);
      if(sc>best){best=sc;bi=i;bc=m===rr?0:m===gr?1:2}
    }
    if(bi<0)break;
    const sh=16-8*bc,b=boxes[bi];
    b.sort((x,y)=>((x>>sh)&255)-((y>>sh)&255));
    const mid=b.length>>1;
    boxes.splice(bi,1,b.slice(0,mid),b.slice(mid));
  }
  const pal=new Uint8Array(768);
  boxes.forEach((b,i)=>{
    let r=0,g=0,bl=0;
    for(const v of b){r+=v>>16;g+=(v>>8)&255;bl+=v&255}
    const n=b.length||1;
    pal[i*3]=r/n;pal[i*3+1]=g/n;pal[i*3+2]=bl/n;
  });
  return pal;
}

function render(){
  const t=$('#thumbs');t.innerHTML='';
  files.forEach((f,i)=>{
    const d=document.createElement('div');d.className='it';d.draggable=true;
    const im=new Image();im.src=getUrl(f);im.loading='lazy';im.draggable=false;
    const nb=document.createElement('span');nb.className='nb';nb.textContent=i+1;
    const x=document.createElement('button');x.className='x';x.textContent='×';x.title='削除';
    x.onclick=e=>{e.stopPropagation();rmUrl(f);files.splice(i,1);render()};
    d.append(im,nb,x);
    d.ondragstart=e=>{dragI=i;d.classList.add('drag');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','')};
    d.ondragend=()=>{d.classList.remove('drag');dragI=-1};
    d.ondragover=e=>{if(dragI<0)return;e.preventDefault();d.classList.add('over')};
    d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{if(dragI<0)return;e.preventDefault();e.stopPropagation();const [m]=files.splice(dragI,1);files.splice(i,0,m);dragI=-1;render()};
    t.appendChild(d);
  });
  $('#cnt').textContent=files.length?files.length+' 枚 / ドラッグで並べ替え、ホバーの×で削除'+(files.length>3000?' / 枚数が多いため、時間とメモリを多く使います':''):'';
  ['go','rev','srt','clr'].forEach(id=>$('#'+id).disabled=!files.length||busy);
}
function add(list){
  const im=[...list].filter(f=>f.type.startsWith('image/'));
  files=files.concat(im);
  render();
}
const drop=$('#drop');
drop.onclick=()=>$('#file').click();
$('#file').onchange=e=>{add(e.target.files);e.target.value=''};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};
drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');add(e.dataTransfer.files)};
$('#rev').onclick=()=>{files.reverse();render()};
$('#srt').onclick=()=>{files.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));render()};
$('#clr').onclick=()=>{urlMap.forEach(u=>URL.revokeObjectURL(u));urlMap.clear();files=[];render();$('#res').hidden=true};
document.querySelectorAll('[data-ms]').forEach(b=>b.onclick=()=>$('#ms').value=b.dataset.ms);
$('#stop').onclick=()=>{stopFlag=true};
$('#pv').onclick=()=>{$('#out').src=resUrl;$('#out').hidden=false;$('#pv').hidden=true};

$('#go').onclick=async()=>{
  if(busy||!files.length)return;
  busy=true;stopFlag=false;render();
  $('#stop').disabled=false;$('#res').hidden=true;
  const pg=$('#pg'),stx=$('#st');pg.hidden=false;pg.max=files.length;pg.value=0;
  try{
    const files=sel(),skip=+$('#skip').value;pg.max=files.length;
    const W=Math.max(16,Math.min(1200,+$('#w').value||400));
    const delay=Math.max(2,Math.round((+$('#ms').value||100)*skip/10));
    const bg=$('#bg').value,loop=+$('#loop').value;
    const tol=+$('#diff').value,useD=tol>=0,NC=Math.min(+$('#cols').value,useD?255:256),mcs=Math.max(2,Math.ceil(Math.log2(NC+(useD?1:0)))),TI=NC;
    const first=await createImageBitmap(files[0]);
    const H=Math.max(1,Math.round(W*first.height/first.width));first.close();
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const ctx=c.getContext('2d',{willReadFrequently:true});
    const grab=async f=>{
      const bm=await createImageBitmap(f);
      const s=Math.min(W/bm.width,H/bm.height),dw=Math.round(bm.width*s),dh=Math.round(bm.height*s);
      ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
      ctx.drawImage(bm,(W-dw)>>1,(H-dh)>>1,dw,dh);bm.close();
      return ctx.getImageData(0,0,W,H).data;
    };
    // 1) palette from sampled frames
    stx.textContent='色を解析中…';
    const nS=Math.min(files.length,30),stepF=files.length/nS;
    const stride=Math.max(1,Math.floor(W*H/Math.ceil(60000/nS)));
    const samples=[];
    for(let i=0;i<nS;i++){
      try{const d=await grab(files[Math.floor(i*stepF)]);
        for(let p=0;p<W*H;p+=stride){const q=p*4;samples.push(d[q]<<16|d[q+1]<<8|d[q+2])}}catch(e){}
    }
    const pal=medianCut(samples,NC);
    const cache=new Int16Array(32768).fill(-1);
    const dist=(a,b)=>{const dr=pal[a*3]-pal[b*3],dg=pal[a*3+1]-pal[b*3+1],db=pal[a*3+2]-pal[b*3+2];return dr*dr*2+dg*dg*4+db*db*3};
    let prev=null;
    const nearest=(r,g,b)=>{let bi=0,bd=1e9;
      for(let i=0;i<NC;i++){const dr=r-pal[i*3],dg=g-pal[i*3+1],db=b-pal[i*3+2],d=dr*dr*2+dg*dg*4+db*db*3;if(d<bd){bd=d;bi=i}}
      return bi};
    // 2) header
    const parts=[];
    const hd=[71,73,70,56,57,97,W&255,W>>8,H&255,H>>8,0xF0|(mcs-1),0,0];
    parts.push(new Uint8Array(hd),pal.subarray(0,3<<mcs));
    parts.push(new Uint8Array([0x21,0xFF,0x0B,...'NETSCAPE2.0'.split('').map(x=>x.charCodeAt(0)),3,1,loop&255,loop>>8,0]));
    const px=new Uint8Array(W*H),buf=new Uint8Array(W*H*2+4096);
    let n=0;
    for(let i=0;i<files.length;i++){
      if(stopFlag){stx.textContent='中止しました';throw 0}
      let d;try{d=await grab(files[i])}catch(e){continue}
      for(let p=0,q=0;p<px.length;p++,q+=4){
        const r=d[q],g=d[q+1],b=d[q+2],k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);
        let v=cache[k];if(v<0){v=nearest(r,g,b);cache[k]=v}
        px[p]=v;
      }
      let bx=0,by=0,bw=W,bh=H,img=px,tf=0x04;
      if(useD){
        if(!prev)prev=px.slice();
        else{
          let x0=W,x1=-1,y0=H,y1=-1;
          for(let p=0;p<px.length;p++){
            const a=px[p],b=prev[p];
            if(a!==b&&(tol===0||dist(a,b)>tol)){const x=p%W,y=(p/W)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;prev[p]=a}
            else px[p]=TI;
          }
          if(x1<0){x0=x1=y0=y1=0}
          bx=x0;by=y0;bw=x1-x0+1;bh=y1-y0+1;img=new Uint8Array(bw*bh);
          for(let y=0;y<bh;y++)img.set(px.subarray((by+y)*W+bx,(by+y)*W+bx+bw),y*bw);
          tf=0x05;
        }
      }
      const len=lzw(img,buf,mcs);
      const nb=Math.ceil(len/255),fr=new Uint8Array(8+10+1+len+nb+1);
      let o=0;
      fr.set([0x21,0xF9,4,tf,delay&255,delay>>8,TI,0,0x2C,bx&255,bx>>8,by&255,by>>8,bw&255,bw>>8,bh&255,bh>>8,0,mcs],o);o+=19;
      for(let s=0;s<len;s+=255){const m=Math.min(255,len-s);fr[o++]=m;fr.set(buf.subarray(s,s+m),o);o+=m}
      fr[o++]=0;
      parts.push(fr.subarray(0,o));n++;
      pg.value=i+1;stx.textContent='変換中… '+(i+1)+' / '+files.length;
      await new Promise(r=>setTimeout(r));
    }
    parts.push(new Uint8Array([0x3B]));
    const blob=new Blob(parts,{type:'image/gif'});
    if(resUrl)URL.revokeObjectURL(resUrl);
    resUrl=URL.createObjectURL(blob);
    if(n<=300){$('#out').src=resUrl;$('#out').hidden=false;$('#pv').hidden=true}else{$('#out').hidden=true;$('#pv').hidden=false}
    $('#dl').href=resUrl;
    $('#info').textContent=W+'×'+H+' / '+n+'コマ / '+(blob.size/1048576).toFixed(1)+' MB';
    $('#res').hidden=false;stx.textContent='完了しました';
  }catch(e){if(e!==0){stx.textContent='エラー: '+(e&&e.message||e)}}
  busy=false;$('#stop').disabled=true;pg.hidden=true;render();
};
</script>
</body>
</html>
